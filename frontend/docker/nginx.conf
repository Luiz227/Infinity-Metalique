map $http_x_forwarded_proto $onlyoffice_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $onlyoffice_host {
    default $http_x_forwarded_host;
    "" $host;
}

map $http_upgrade $onlyoffice_connection {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location /backend/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_read_timeout 180s;
    }

    location /assets/uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /desktop-updates/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /onlyoffice/ {
        proxy_pass http://onlyoffice/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $onlyoffice_host/onlyoffice;
        proxy_set_header X-Forwarded-Proto $onlyoffice_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $onlyoffice_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
