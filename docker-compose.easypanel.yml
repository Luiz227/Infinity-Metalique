services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - infinity

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: Metalique Infinity
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      APP_TIMEZONE: America/Sao_Paulo
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-infinity_metalique}
      DB_USERNAME: ${DB_USERNAME:-infinity}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      SESSION_LIFETIME: "480"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      HASH_DRIVER: argon2id
      ARGON_MEMORY: "65536"
      ARGON_TIME: "4"
      ARGON_THREADS: "2"
    volumes:
      - laravel-storage:/var/www/html/storage
      - laravel-uploads:/var/www/html/public/assets/uploads
      - desktop-updates:/var/www/html/public/desktop-updates
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - infinity

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-infinity_metalique}
      MARIADB_USER: ${DB_USERNAME:-infinity}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - infinity

networks:
  infinity:

volumes:
  mariadb-data:
  laravel-storage:
  laravel-uploads:
  desktop-updates:

